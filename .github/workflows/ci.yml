name: CI — TypeScript & Build Check

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies cleanly
        run: npm ci

      - name: Strict TypeScript Check & Production Bundle
        run: npm run build

