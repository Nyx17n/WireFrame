stages:
  - check
  - release

typecheck-and-build:
  stage: check
  image: node:22
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  script:
    - npm ci --cache .npm
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

package-windows-nsis:
  stage: release
  tags:
    - saas-windows-medium-amd64
  script:
    - npm ci
    - npm run build
    - npx electron-builder --win --publish never
    - |
      $baseUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/wireframe-releases/latest"
      $headers = @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }
      foreach ($file in Get-ChildItem -Path "release" -Include "*.exe","*.blockmap","latest.yml" -Recurse) {
        Invoke-RestMethod -Headers $headers -InFile $file.FullName -Uri "$baseUrl/$($file.Name)" -Method put
      }
  artifacts:
    name: "WireFrame-${CI_COMMIT_TAG}-win-x64"
    paths:
      - release/*.exe
      - release/*.blockmap
      - release/latest.yml
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
