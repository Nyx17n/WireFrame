appId: com.nyxo17.tennoframe
productName: TennoFrame
copyright: Copyright © 2026 Maxime (Nyxo17)

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/codex-db.json
    to: codex-db.json
  - from: resources/codex-craft-recipes.json
    to: codex-craft-recipes.json
  - from: resources/codex-mobs-vendors.json
    to: codex-mobs-vendors.json

asar: true

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Preserve legacy NSIS UUIDv5(com.nyxo17.wireframe) so existing WireFrame installations
  # upgrade seamlessly in-place to TennoFrame and replace Desktop/Start Menu shortcuts cleanly.
  guid: 7e820ac6-b754-5ba4-947f-81d8753d8e46
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TennoFrame
  artifactName: TennoFrame-Setup-${version}.${ext}

publish:
  provider: github
  owner: Nyx17n
  repo: TennoFrame
  releaseType: release
